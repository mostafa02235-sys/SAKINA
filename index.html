<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17527a">
  <meta name="description" content="SAKINA — an interactive world for learning the Qur'an and the authentic Sunnah.">
  <title>SAKINA · سكينة</title>

  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <!-- The loading screen is styled here so it shows before anything else has loaded. -->
  <style>
    html, body { margin: 0; height: 100%; background: #17527a; }
    .boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, #17527a, #2f93b0 55%, #8fd6cf);
      color: #fff; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; text-align: center;
    }
    .boot img { width: 120px; height: 120px; animation: boot-float 2.4s ease-in-out infinite; }
    .boot b { font-size: 34px; letter-spacing: .04em; }
    .boot__dots { display: flex; gap: 8px; direction: ltr; }
    .boot__dots i { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: boot-dot 1s ease-in-out infinite; }
    .boot__dots i:nth-child(2) { animation-delay: .15s; }
    .boot__dots i:nth-child(3) { animation-delay: .3s; }
    .boot__error { display: none; max-width: 300px; font-size: 17px; line-height: 1.5; }
    .boot__error button {
      margin-top: 14px; padding: 12px 26px; border: 3px solid #1d2a4d; border-radius: 18px;
      background: #fff9ec; color: #1d2a4d; font: inherit; font-weight: bold;
    }
    .boot.has-error .boot__dots { display: none; }
    .boot.has-error .boot__error { display: block; }
    @keyframes boot-float { 50% { transform: translateY(-10px); } }
    @keyframes boot-dot { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>

  <!-- Online fonts are a bonus for the website; the Android app carries its own copies. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/characters.css">
  <link rel="stylesheet" href="src/styles/world.css">
  <link rel="stylesheet" href="src/styles/island.css">
  <link rel="stylesheet" href="src/styles/lesson.css">
  <link rel="stylesheet" href="src/styles/friends.css">
  <link rel="stylesheet" href="src/styles/journey.css">
  <link rel="stylesheet" href="src/styles/avatar.css">
</head>
<body>
  <div id="boot" class="boot" role="status">
    <img src="assets/icon.svg" alt="">
    <b>SAKINA</b>
    <div class="boot__dots"><i></i><i></i><i></i></div>
    <div class="boot__error">
      <p>تعذّر تشغيل التطبيق.<br>The app could not start.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة · Try again</button>
    </div>
  </div>

  <div id="app" class="app">
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="SAKINA"></nav>
  </div>

  <noscript>SAKINA needs JavaScript to run.</noscript>

  <!-- If the app has not started after a while, or fails while starting, say so
       and offer a retry instead of leaving the loading screen up forever. -->
  <script>
    (function () {
      function fail() {
        var boot = document.getElementById('boot');
        if (boot && !window.sakinaReady) boot.classList.add('has-error');
      }
      window.addEventListener('error', function (event) {
        // Only scripts matter here; a font or image that fails to load is not fatal.
        var el = event.target;
        if (el === window || (el && el.tagName === 'SCRIPT')) fail();
      }, true);
      window.addEventListener('unhandledrejection', fail);
      setTimeout(fail, 10000);
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
